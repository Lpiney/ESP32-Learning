; ESP32-S3-N16R8  ——  16MB flash + 8MB OPI PSRAM
; 板子: 淘宝 "ESP32-S3-N16R8开发板(带天线座)"
; 接线: Type-C 插板上标 UART 的那个口 (板载 FT232RL) -> /dev/cu.usbserial-A5069RR4

[env:esp32-s3-n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; ---- 库依赖 ----
; Adafruit SSD1306  : OLED 屏驱动 (初始化 + 把显存刷到屏)
; Adafruit GFX      : 绘图基元 (画点/线/字), SSD1306 依赖它
; ArduinoJson       : 解析和风天气返回的 JSON
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson

; ---- N16R8 硬件参数 (devkitc-1 默认是 N8 无 PSRAM, 必须覆盖) ----
; memory_type 让平台链接 tools/sdk/esp32s3/qio_opi (CONFIG_SPIRAM_MODE_OCT=1)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; ---- 串口 ----
; 走板载 FT232R (UART0), 所以不开 USB CDC, Serial 才会从这个口出来
upload_port = /dev/cu.usbserial-A5069RR4
monitor_port = /dev/cu.usbserial-A5069RR4
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; BOARD_HAS_PSRAM 必须手写: 没有它 esp32-hal-psram.h 会把 CONFIG_SPIRAM 主动 #undef 掉,
; PSRAM 会被识别成 0MB (核心 2.0.x 的坑, 板级 json 里不含这个宏)
;
; ARDUINO_LOOP_STACK_SIZE: 主循环任务 (setup/loop 所在的那个任务) 的栈大小, 单位字节。
; 默认只有 8192, 但 HTTPS 的 TLS 握手本身就很吃栈, 再加上 ROM 里的 gzip 解压器
; (tinfl 内部要在栈上放一个约 5KB 的结构体) 会超出, 表现为
; "Stack canary watchpoint triggered" 崩溃。这里给到 32KB。
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_LOOP_STACK_SIZE=32768
