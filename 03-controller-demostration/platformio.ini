; 第 3 课：摇杆示波器 —— 把 PS2 摇杆的位置画到 OLED 上
; 板子：ESP32-S3-N16R8
;
; 屏：4 脚 I2C 版 SSD1306（丝印 GND VCC SCL SDA），和 01 课同款
;     -> 只需要 2 根信号线，接线比 SPI 版省事得多

[env:esp32-s3-n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; ---- 库依赖 ----
; Adafruit SSD1306 : OLED 屏驱动（本课走 I2C 模式，构造时传 &Wire）
; Adafruit GFX     : 绘图基元（画点/线/圆/字），SSD1306 依赖它
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

; ---- N16R8 硬件参数 ----
; 这块板子是 16MB flash + 8MB Octal PSRAM，必须覆盖 devkitc-1 的默认值。
;
; !!! 重要 !!! memory_type = qio_opi 表示 PSRAM 走 Octal(8线) 模式，
; 这会占用 GPIO33 ~ GPIO37。所以这 5 个脚在代码里绝对不能拿来接东西，
; 接了会直接启动失败 / 程序跑飞。本课的接线表已经避开了它们。
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; ---- 串口 ----
; 走板载 FT232（插板上标 UART 的那个 Type-C 口）
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

; 不写死 upload_port：PlatformIO 会自动找到板子的串口
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
