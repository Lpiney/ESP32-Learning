; 第 2 课：三色 LED —— 交通灯 & 流水灯
; 板子：ESP32-S3-N16R8

[env:esp32-s3-n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; 串口走板载 FT232（插板上标 UART 的那个 Type-C 口），与 01 课保持一致
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

; 不写死 upload_port：PlatformIO 会自动找到板子的串口
upload_speed = 460800
monitor_speed = 115200
